services:
  - type: web
    name: movie-promo-bot
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MODE
        value: webhook
      - key: PORT
        value: 3000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GROUP_ID
        sync: false
      - key: WEBSITE_URL
        value: https://your-social-website.com
      - key: PROMO_THRESHOLD
        value: "10"
      - key: PROMO_COOLDOWN_MINUTES
        value: "30"
      - key: ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: movie-promo-db
          property: connectionString

databases:
  - name: movie-promo-db
    plan: free
    databaseName: moviepromo
    user: moviepromo_user
